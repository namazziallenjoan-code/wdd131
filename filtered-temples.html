<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temple Album | Namazzi Allen Joan</title>
  <meta name="description" content="Explore beautiful temples around the world in this Temple Album featuring temple photographs and information by Namazzi Allen Joan.">
  <meta name="author" content="Namazzi Allen Joan">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lora:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/filtered-temples.css">

  <!-- JavaScript -->
  <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

  <header>
    <div class="header-container">

      <h1>Temple Album</h1>

      <nav aria-label="Temple filters">
        <ul>
            <li><button type="button" class="active" data-filter="home">Home</button></li>
            <li><button type="button" data-filter="old">Old</button></li>
            <li><button type="button" data-filter="new">New</button></li>
            <li><button type="button" data-filter="large">Large</button></li>
            <li><button type="button" data-filter="small">Small</button></li>
        </ul>
      </nav>

    </div>
  </header>

  <main>
      <h2 id="gallery-title">Home</h2>

      <!-- JavaScript will generate temple cards here -->
      <div class="temple-container" id="temple-container"></div>
   </main>

  <footer>
      <p>
         © <span id="currentyear"></span>
        🌺 Namazzi Allen Joan 🌺 Uganda
      </p>

      <p>
        Last Modification:
        <span id="lastmodified"></span>
      </p>
  </footer>

</body>
</html>
