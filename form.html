<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Submit a product review by sharing your rating, installation date, useful features, and personal feedback.">
    <meta name="author" content="Namazzi Allen Joan">

    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <h2>Share Your Product Review</h2>

        <form method="get" action="review.html">

            <label for="productName">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <label for="rating1">★</label>
                <input type="radio" id="rating1" name="rating" value="1" required>

                <label for="rating2">★★</label>
                <input type="radio" id="rating2" name="rating" value="2">

                <label for="rating3">★★★</label>
                <input type="radio" id="rating3" name="rating" value="3">

                <label for="rating4">★★★★</label>
                <input type="radio" id="rating4" name="rating" value="4">

                <label for="rating5">★★★★★</label>
                <input type="radio" id="rating5" name="rating" value="5">
            </fieldset>

            <label for="installationDate">Date of Installation</label>
            <input type="date" id="installationDate"
                name="installationDate" required>

            <fieldset>
                <legend>Which features did you find useful?</legend>

                <label for="durability">
                    <input type="checkbox" id="durability"
                        name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease"
                        name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance"
                        name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design"
                        name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="writtenReview">Written Review (Optional)</label>
            <textarea id="writtenReview" name="writtenReview"
                rows="5"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Namazzi Allen Joan | Uganda</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
    </footer>
</body>
</html>
